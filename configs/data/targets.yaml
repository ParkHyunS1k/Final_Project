# 학습 타겟 정의. 안전난간과 안전고리는 별도 모델로 학습한다.
#
# 이유 (docs/phase0_results.md 1절, 7절):
#   안전난간 SO-01 은 비계작업에만, 안전고리 WO-06 은 공통에만 라벨된다.
#   두 파티션을 합치면 서로의 클래스가 "라벨 없는 positive" 가 되어
#   모델이 그것을 배경으로 학습한다.
#
# situation 제약도 필수다. 같은 작업유형 안에서도 상황유형에 따라
# 라벨 부착 여부가 갈린다. 실측 (507 Validation):
#
#   비계작업  UA 14,180프레임 SO-01 0건 | UC 5,070 SO-01 0건 | WS 6,916 SO-01 6,464건
#   공통      UA 15,934프레임 WO-06 4,041건 | WS 2,664 WO-06 0건
#
# 상황유형을 안 거르면 UA/UC 프레임의 난간이 배경으로 학습된다.

guardrail:
  description: 안전난간 탐지. 비계작업 작업상황(WS) 프레임만 사용
  label_root: D:/507/label_val
  source_root: D:/507/source_val
  process_id: A          # 비계작업
  situations: [WS]       # SO-01 이 라벨되는 유일한 상황유형
  classes:               # AI Hub 코드 -> YOLO 클래스명 (순서가 곧 클래스 ID)
    SO-01: guardrail
    SO-02: work_platform
    WO-01: worker
  require: [SO-01]       # 이 코드가 하나도 없는 프레임은 positive 가 아니다
  # 배경 프레임을 쓰지 않는다. 육안 확인 완료 (원천 확보 후):
  #   H-211108_A19_A_WS-08_202_0292 는 라벨 0줄인 배경 프레임인데
  #   이동식비계의 상부·중간 난간대와 작업발판이 화면에 명확히 보인다.
  # SO-01 이 라벨된 현장은 A04/A08/A17/A21 네 곳뿐이고 (Training 파티션도 동일),
  # 나머지 현장의 WS 프레임은 "난간이 없는 장면" 이 아니라 "난간에 라벨이 없는
  # 장면" 이다. 배경으로 쓰면 모델에게 난간을 배경이라고 가르친다.
  negative_ratio: 0.0

# 안전고리 파이프라인 1단계 — VLM 에 넘길 작업자 크롭을 만든다.
#
# YOLO 로 고리 자체를 탐지하지 않는다. 원본 1920x1080 에서 고리(카라비너)는
# 눈금자 실측 약 18~25 px 이고, imgsz 640 으로 줄이면 6~8 px 라 탐지가 성립하지
# 않는다. 전신 박스(중앙값 168x491 px)를 잘라 640 으로 키우면 1.30 배가 되어
# 고리가 23~33 px 가 된다 (VLM 입력을 896 으로 올리면 33~46 px).
# 체결 여부 판단은 VLM 이 한다 (README 5절). 그래서 여기서는 상태를 학습하지
# 않으며, 클래스명에도 상태를 넣지 않는다.
#
# 507 라벨에는 고리를 잡은 박스가 없다. WO-06 은 작업자 몸통(어깨~허벅지),
# UA-01 은 전신이다 (docs/data_plan.md 5절, 박스를 잘라 확인).
# 둘은 같은 사람의 중첩 박스라 두 클래스로 학습할 이유가 없다. 전신을 쓴다 —
# 실측에서 사람과의 겹침이 97.7% 로 몸통(80.3%)보다 정확했고, 체결 여부를 보려면
# 고리가 걸릴 앵커(난간·구명줄)까지 보여야 하므로 크롭에 여유가 필요하다.
hook_stage1:
  description: 안전고리 판단용 작업자 크롭 제공. 공통 불안전행동(UA) 프레임만 사용
  label_root: D:/507/label_val
  source_root: D:/507/source_val
  process_id: F          # 공통
  situations: [UA]
  classes:
    UA-01: worker         # 전신 (면적 중앙값 0.0323). 상태가 아니라 관측된 물체다
  require: [UA-01]
  # UA 프레임 중 UA-01 이 없는 것은 안전벨트/안전모 미착용 등 다른 시나리오다.
  # 그 프레임에도 작업자가 있으나(실측 프레임당 0.99명) 라벨이 없으므로
  # 배경으로 쓰면 "작업자 = 배경" 을 가르치게 된다.
  negative_ratio: 0.0

# 현장 단위 분할 설정 (README 8절). 프레임 단위 분할 금지.
split:
  ratios: [0.7, 0.15, 0.15]   # train / val / test
  seed: 0
  # 층화 기준은 비운다. 분할 단위가 촬영 현장(build_dataset.py 의 group_id)이라
  # 한 그룹 안에 여러 상황·기기가 섞이고, 층화 키는 그룹 안에서 상수여야 한다.
  #
  # device 를 층화 기준으로 두면 안 된다. 한 촬영 세션을 1인칭(device=0)과
  # 3인칭(device=1) 카메라로 동시에 찍었기 때문에, 각 split 에 두 기기를 채우려면
  # 같은 세션을 쪼개는 수밖에 없다. 실제로 그렇게 새고 있었다:
  #   H-211104_A04_A_WS-01_101 (device 0) -> train
  #   H-211104_A04_A_WS-01_201 (device 1) -> val
  #   H-211104_A04_A_WS-01_301 (device 1) -> test
  # 세 장 모두 같은 작업자가 같은 비계에서 실리콘을 시공하는 같은 순간이다.
  #
  # README 8절 "각 split 에 세 촬영 시점이 모두 포함" 은 현장 단위로 묶어도
  # 대체로 충족된다. 한 현장을 두 기기로 함께 찍기 때문이다.
  # 재생성 후 split.json 으로 실제 기기 구성을 확인할 것.
  stratify_by: []
